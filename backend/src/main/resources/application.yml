spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/movierec
    username: movierec
    password: movierec
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cookie-secure: ${COOKIE_SECURE:false}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:avatars}
