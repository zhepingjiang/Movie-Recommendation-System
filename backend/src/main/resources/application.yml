spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/movierec
    username: movierec
    password: movierec
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: movie-rec-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # FIX: JsonDeserializer used directly throws inside poll(), before the listener's error
      # handler can act, so one unparseable record (e.g. a headerless message published by hand
      # with kafka-console-producer) was retried forever and blocked the whole partition.
      # ErrorHandlingDeserializer turns it into a DeserializationException the default error
      # handler logs once and skips.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.movierec.backend.event
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cookie-secure: ${COOKIE_SECURE:false}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:avatars}

recommendation:
  service:
    # FIX: the Python recommendation service must never be called directly by the browser (it has
    # no auth of its own) — only this backend calls it, server-to-server over gRPC, after resolving
    # the caller's identity from the JWT. Port 50051 is published to the host, loopback-only (see
    # docker-compose.yml), because this backend itself runs on the host rather than in
    # docker-compose.
    host: ${RECOMMENDATION_SERVICE_HOST:localhost}
    port: ${RECOMMENDATION_SERVICE_PORT:50051}
  # Request-time merge of the Flink job's nearline_v1 rows into blended_v1 (see
  # NearlineRecommendationBlender). Hand-set starting values, not tuned -- the offline NDCG grid
  # search only has rating holdouts, which can't judge minutes-scale view signal. Tuning these
  # needs persisted view history (session replay, next-view hit rate) or online A/B.
  nearline:
    # Nearline weight halves every half-life since the batch's generated_at. ~5 Flink window
    # slides of inactivity before a session's influence is halved.
    freshness-half-life: PT15M
    # Weight of a just-written nearline batch; blended_v1 always keeps at least half the say.
    max-weight: 0.5
    # Rows older than this are skipped in SQL entirely (weight is ~0.4% of max by then). The
    # offline blend also wipes all nearline_v1 rows on every run.
    max-age: PT2H
