apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: movie-rec
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # Recreate (not RollingUpdate): a PVC with ReadWriteOnce can only be mounted by one pod at a
  # time, so a rolling update would deadlock trying to start the new pod before the old one
  # releases the volume.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            # The official postgres image's docs recommend a subdirectory of the mount point,
            # not the mount point itself -- some volume plugins seed the root with a lost+found
            # dir, which trips up initdb's "must be empty" check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "movierec"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "movierec"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: movie-rec
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
