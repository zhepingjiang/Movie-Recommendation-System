# Dev-only credentials -- these are the exact same insecure defaults already committed in
# docker-compose.yml and backend/src/main/resources/application.yml, just relocated into
# Secret objects so the Deployments below can reference them the standard k8s way. Not fit for
# anything beyond local minikube use; see the security-review notes in the migration summary.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: movie-rec
type: Opaque
stringData:
  POSTGRES_DB: movierec
  POSTGRES_USER: movierec
  POSTGRES_PASSWORD: movierec
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: movie-rec
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: movie-rec
type: Opaque
stringData:
  JWT_SECRET: dev-only-insecure-secret-change-me-please-32-bytes-min
  SPRING_DATASOURCE_PASSWORD: movierec
