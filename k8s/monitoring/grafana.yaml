# Grafana on minikube, provisioned from the same monitoring/grafana files docker-compose mounts
# (generated ConfigMaps, see monitoring/kustomization.yaml) at the same paths. The datasource URL
# (http://prometheus:9090) resolves to the prometheus Service in this namespace.
#
# No PVC on purpose: the datasource and dashboards are provisioned from git on every start, so the
# pod holds no state worth keeping. Dashboards edited in the UI are lost on restart -- export the
# JSON into monitoring/grafana/dashboards instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          # Pinned (not :latest like docker-compose): the same version docker-compose's :latest
          # currently resolves to.
          image: grafana/grafana:13.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: GF_SECURITY_ADMIN_PASSWORD
            # FIX: Grafana downloads and updates a set of preinstalled plugins (jaeger, influxdb,
            # mssql, loki...) on every start -- every restart here, since there's no PVC -- which
            # OOMKilled it at the original 256Mi limit. Only the core Prometheus datasource is used.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          ports:
            - containerPort: 3000
          # Measured ~245Mi steady-state (Grafana 13, preinstall disabled).
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # Names here are rewritten to the hashed generated names by kustomize.
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: movie-rec
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
