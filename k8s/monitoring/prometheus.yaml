# Prometheus on minikube. Config comes from generated ConfigMaps (kustomization.yaml in this folder):
# prometheus-config (./prometheus.yml) and prometheus-alerts (monitoring/alerts/*.yml).
#
# RBAC: kubernetes_sd_configs lists and watches pods through the k8s API, so Prometheus runs as its
# own ServiceAccount. It only discovers pods in movie-rec, so a namespaced Role is enough -- it
# can't see anything in other namespaces. A ClusterRole would only be needed for node/cAdvisor
# metrics or other namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: movie-rec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: movie-rec
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: movie-rec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: movie-rec
---
# Keeps metric history across pod restarts; retention flags below keep it well under the size.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: movie-rec
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  # Recreate for the same ReadWriteOnce-PVC reason as postgres.yaml (and Prometheus also holds a
  # lock on its TSDB directory).
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      securityContext:
        # The image runs as nobody (65534); makes the data volume writable by it.
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: prometheus
          # Pinned (not :latest like docker-compose): the same version docker-compose's :latest
          # currently resolves to.
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=1GB
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: alerts
              mountPath: /etc/prometheus/alerts
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        # Names here are rewritten to the hashed generated names by kustomize.
        - name: config
          configMap:
            name: prometheus-config
        - name: alerts
          configMap:
            name: prometheus-alerts
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: movie-rec
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
