# No PVC: matches docker-compose.yml's redis_data volume role (cache only, fine to lose on
# pod restart) -- kept ephemeral here to avoid claiming storage for data nothing needs to survive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: movie-rec
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
