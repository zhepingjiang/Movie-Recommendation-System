apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: movie-rec
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: minio/minio:latest
          # FIX: minio/minio is no longer pullable from Docker Hub ("pull access denied"), and a
          # :latest tag defaults to imagePullPolicy Always, so every pod start tried to re-pull
          # and failed with ErrImagePull (which also crash-looped the backend, since it can't
          # create its avatars bucket). The image (RELEASE.2025-09-07T16-13-09Z) now only exists in
          # the host's Docker cache -- load it with `minikube image load minio/minio:latest`.
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: movie-rec
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
