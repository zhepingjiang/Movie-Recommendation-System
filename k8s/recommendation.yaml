# Live serving path (grpc_server.py -> services/cold_start.py) only ever queries Postgres --
# MinIO is touched solely by the offline pipeline, which runs as its own pod from the nightly
# CronJob in k8s/offline-pipeline-cronjob.yaml, not from this one. That's why this Deployment
# only overrides DB_HOST, matching docker-compose.yml's recommendation service exactly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
      # Picked up by k8s/monitoring/prometheus.yml's pod discovery (prometheus-fastapi-instrumentator).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      containers:
        - name: recommendation
          image: movie-rec-recommendation:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 50051
          env:
            - name: DB_HOST
              value: postgres
            # Tracing (recommendation/telemetry.py), same three variables as
            # docker-compose.otel.yml. Spans go to the Collector in
            # k8s/monitoring/otel-collector.yaml. Removing OTEL_TRACING_ENABLED turns tracing off.
            - name: OTEL_TRACING_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: recommendation
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # Tags every span with the pod that produced it. POD_NAME must be declared before the
            # variable that references it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=movie-rec,k8s.pod.name=$(POD_NAME)
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: movie-rec
spec:
  selector:
    app: recommendation
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 50051
      targetPort: 50051
