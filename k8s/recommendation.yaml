# Live serving path (grpc_server.py -> services/cold_start.py) only ever queries Postgres --
# MinIO is touched solely by the offline training job (models/svd_training.py), which runs
# manually from the host via recommendation/scripts/train_svd.py, not from this pod. That's why
# this Deployment only overrides DB_HOST, matching docker-compose.yml's recommendation service
# exactly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: movie-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
    spec:
      enableServiceLinks: false
      containers:
        - name: recommendation
          image: movie-rec-recommendation:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 50051
          env:
            - name: DB_HOST
              value: postgres
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: movie-rec
spec:
  selector:
    app: recommendation
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 50051
      targetPort: 50051
