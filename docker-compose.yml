services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: movierec
      POSTGRES_USER: movierec
      POSTGRES_PASSWORD: movierec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movierec"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single-node dev cluster: defaults require 3 brokers for these.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation:
    build:
      # Context is the repo root, not ./recommendation: the Dockerfile needs to reach the
      # shared proto/ directory to generate its gRPC stubs at build time (they're gitignored,
      # not committed -- see recommendation/scripts/generate_proto.sh).
      context: .
      dockerfile: recommendation/Dockerfile
    environment:
      # FIX: db.py defaults DB_HOST to "localhost", which inside this container means itself,
      # not the postgres container -- cold-start recommendations 500'd on every request until
      # this was set (verified while testing the /register onboarding flow's step 3).
      DB_HOST: postgres
    ports:
      # Loopback-only: the Spring Boot backend runs on the host (not in this compose file) and
      # calls this service directly, but it must never be reachable from outside the host --
      # it has no auth of its own and trusts user_id/limit as given (see RecommendationController).
      # 8000 is the FastAPI app (just /ping now); 50051 is the gRPC server the backend calls.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - recommendation

volumes:
  postgres_data:
  minio_data:
  redis_data:
