# Default Kafka bootstrap servers for this job when run against docker-compose's INTERNAL
# listener. Override with the KAFKA_BOOTSTRAP_SERVERS env var for other environments
# (e.g. minikube).
kafka.bootstrap.servers=kafka:29092

# Same dev-default credentials used everywhere else in docker-compose.yml (postgres, minio) --
# not a real secret, but flagging since it's DB credentials. "postgres" is the docker-network
# hostname (docker-compose.yml's postgres service), matching the backend container's DB_HOST.
postgres.jdbc.url=jdbc:postgresql://postgres:5432/movierec
postgres.username=movierec
postgres.password=movierec
