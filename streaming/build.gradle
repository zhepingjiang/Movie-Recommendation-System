plugins {
	id 'java'
	id 'application'
	id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.movierec'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// Flink 2.2's default/recommended runtime is Java 17 -- Java 21 support there is still
		// experimental, so this module intentionally doesn't match the backend's Java 21
		// toolchain to avoid Flink compatibility surprises.
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	flinkVersion = '2.2.1'
}

dependencies {
	// compileOnly: the Flink cluster's own lib/ already provides these at runtime -- bundling
	// them into the submitted jar would bloat it and risk classloader conflicts with the
	// cluster's own copies. Connector deps (Kafka here, JDBC in a later phase) are NOT provided
	// by the cluster and do need to be shadowJar-bundled, so they're implementation, not compileOnly.
	compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
	compileOnly "org.apache.flink:flink-clients:${flinkVersion}"

	implementation 'org.apache.flink:flink-connector-kafka:5.0.0-2.2'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
	// JDBC driver for the movie_similarity_cache lookup -- not in the Flink cluster's lib/, so
	// (like the Kafka connector above) it needs to be shadowJar-bundled.
	implementation 'org.postgresql:postgresql:42.7.4'
	// Bounded (size + TTL) local cache in front of the JDBC lookup -- the same building block
	// Flink's own Table API "PARTIAL" lookup-cache mode uses internally, chosen over a full
	// in-memory preload of movie_similarity_cache so memory use is capped by policy rather than
	// by however large that table grows.
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
	testImplementation "org.apache.flink:flink-clients:${flinkVersion}"
	// Flink's operator/window test harness (KeyedOneInputStreamOperatorTestHarness etc.) -- lets
	// tests feed synthetic events with controlled timestamps/watermarks and assert on window
	// firing, rather than calling window functions directly and skipping Flink's own windowing.
	testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
	testImplementation platform('org.junit:junit-bom:5.11.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'com.movierec.streaming.MovieViewEventLoggerJob'
}

tasks.named('compileJava') {
	// Jackson deserializes MovieViewEvent (a record) by matching constructor parameter names --
	// without -parameters, compiled records lose those names and deserialization fails.
	options.compilerArgs << '-parameters'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('shadowJar') {
	archiveClassifier.set('')
}
