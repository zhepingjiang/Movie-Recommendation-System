plugins {
	id 'java'
	id 'application'
	id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.movierec'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// Flink 2.2's default/recommended runtime is Java 17 -- Java 21 support there is still
		// experimental, so this module intentionally doesn't match the backend's Java 21
		// toolchain to avoid Flink compatibility surprises.
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	flinkVersion = '2.2.1'
}

dependencies {
	// compileOnly: the Flink cluster's own lib/ already provides these at runtime -- bundling
	// them into the submitted jar would bloat it and risk classloader conflicts with the
	// cluster's own copies. Connector deps (Kafka here, JDBC in a later phase) are NOT provided
	// by the cluster and do need to be shadowJar-bundled, so they're implementation, not compileOnly.
	compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
	compileOnly "org.apache.flink:flink-clients:${flinkVersion}"

	implementation 'org.apache.flink:flink-connector-kafka:5.0.0-2.2'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

	testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
	testImplementation "org.apache.flink:flink-clients:${flinkVersion}"
	testImplementation platform('org.junit:junit-bom:5.11.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
	mainClass = 'com.movierec.streaming.MovieViewEventLoggerJob'
}

tasks.named('compileJava') {
	// Jackson deserializes MovieViewEvent (a record) by matching constructor parameter names --
	// without -parameters, compiled records lose those names and deserialization fails.
	options.compilerArgs << '-parameters'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('shadowJar') {
	archiveClassifier.set('')
}
